name: Playground build

# blueprint.json installs the plugin from switchback-carousel.zip on the
# `playground` branch. Rebuild it from every push to main so the Playground
# demo always runs the current code. The branch holds only the zip and is
# force-pushed each time, so it never accumulates history.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground-build
  cancel-in-progress: true

jobs:
  zip:
    name: Build the plugin zip for Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and zip
        run: npm run plugin-zip

      - name: Publish to the playground branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/playground"
          mkdir -p "$out"
          mv switchback-carousel.zip "$out/"
          cd "$out"
          git init -q -b playground
          git add switchback-carousel.zip
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Playground build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" playground
