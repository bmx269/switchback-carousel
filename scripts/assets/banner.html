<!doctype html>
<html><head><meta charset="utf-8"><style>
	html, body { margin: 0; }
	.banner { position: relative; width: 1544px; height: 500px; overflow: hidden; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
	.banner svg.scene { position: absolute; inset: 0; }
	.copy { position: absolute; left: 96px; top: 112px; color: #F7EFE2; }
	.copy h1 { margin: 0; font-size: 78px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
	.copy h1 span { color: #F4B942; }
	.copy p { margin: 22px 0 0; font-size: 29px; font-weight: 500; opacity: 0.92; max-width: 680px; line-height: 1.3; }
	/* Accessibility badges: light text on the dark green keeps contrast well
	   above WCAG AA, and 21px type stays legible on the 772px banner. */
	.badges { display: flex; gap: 14px; margin: 30px 0 0; padding: 0; list-style: none; }
	.badges li { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 13px; border: 2px solid rgba(247, 239, 226, 0.4); border-radius: 999px; background: rgba(10, 30, 22, 0.45); font-size: 21px; font-weight: 600; white-space: nowrap; }
	.badges svg { flex: none; width: 24px; height: 24px; }
</style></head><body>
<div class="banner" id="banner">
	<svg class="scene" viewBox="0 0 1544 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
				<stop offset="0" stop-color="#16392B"/>
				<stop offset="1" stop-color="#27664C"/>
			</linearGradient>
		</defs>
		<rect width="1544" height="500" fill="url(#sky)"/>
		<circle cx="1440" cy="70" r="40" fill="#F4B942" opacity="0.9"/>
		<!-- Mountains -->
		<path d="M760 500 L1010 190 L1130 300 L1270 150 L1544 420 L1544 500 Z" fill="#1B4A37"/>
		<path d="M900 500 L1120 260 L1250 360 L1400 230 L1544 340 L1544 500 Z" fill="#133427"/>
		<!-- Switchback trail -->
		<path d="M830 500 L960 468 L870 440 L990 414" fill="none" stroke="#E8772E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/>
		<!-- Carousel cards -->
		<g transform="translate(1000 100)">
			<rect x="-8" y="30" width="120" height="190" rx="18" fill="#F7EFE2" opacity="0.28"/>
			<rect x="376" y="30" width="120" height="190" rx="18" fill="#F7EFE2" opacity="0.28"/>
			<rect x="126" y="0" width="236" height="250" rx="22" fill="#F7EFE2"/>
			<path d="M170 218 L290 180 L190 142 L300 104" fill="none" stroke="#E8772E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
			<circle cx="302" cy="52" r="20" fill="#F4B942"/>
			<circle cx="196" cy="290" r="9" fill="#F7EFE2" opacity="0.45"/>
			<rect x="222" y="281" width="44" height="18" rx="9" fill="#E8772E"/>
			<circle cx="292" cy="290" r="9" fill="#F7EFE2" opacity="0.45"/>
		</g>
	</svg>
	<div class="copy">
		<h1>Switchback <span>Carousel</span></h1>
		<p>Accessible carousel blocks for WordPress —<br>any blocks, any posts.</p>
		<ul class="badges">
			<li><svg viewBox="0 0 24 24" fill="none" stroke="#F4B942" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>Keyboard ready</li>
			<li><svg viewBox="0 0 24 24" fill="none" stroke="#F4B942" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>Screen reader friendly</li>
			<li><svg viewBox="0 0 24 24" fill="none" stroke="#F4B942" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 9v6M14 9v6"/></svg>Respects reduced motion</li>
		</ul>
	</div>
</div>
</body></html>
