<!doctype html>
<html><head><meta charset="utf-8"><style>
	html, body { margin: 0; }
	.banner { position: relative; width: 1544px; height: 500px; overflow: hidden; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
	.banner svg.scene { position: absolute; inset: 0; }
	.copy { position: absolute; left: 96px; top: 142px; color: #F7EFE2; }
	.copy h1 { margin: 0; font-size: 78px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
	.copy h1 span { color: #F4B942; }
	.copy p { margin: 22px 0 0; font-size: 29px; font-weight: 500; opacity: 0.88; max-width: 640px; line-height: 1.3; }
</style></head><body>
<div class="banner" id="banner">
	<svg class="scene" viewBox="0 0 1544 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
				<stop offset="0" stop-color="#16392B"/>
				<stop offset="1" stop-color="#27664C"/>
			</linearGradient>
		</defs>
		<rect width="1544" height="500" fill="url(#sky)"/>
		<circle cx="1440" cy="70" r="40" fill="#F4B942" opacity="0.9"/>
		<!-- Mountains -->
		<path d="M760 500 L1010 190 L1130 300 L1270 150 L1544 420 L1544 500 Z" fill="#1B4A37"/>
		<path d="M900 500 L1120 260 L1250 360 L1400 230 L1544 340 L1544 500 Z" fill="#133427"/>
		<!-- Switchback trail -->
		<path d="M830 500 L960 468 L870 440 L990 414" fill="none" stroke="#E8772E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/>
		<!-- Carousel cards -->
		<g transform="translate(1000 100)">
			<rect x="-8" y="30" width="120" height="190" rx="18" fill="#F7EFE2" opacity="0.28"/>
			<rect x="376" y="30" width="120" height="190" rx="18" fill="#F7EFE2" opacity="0.28"/>
			<rect x="126" y="0" width="236" height="250" rx="22" fill="#F7EFE2"/>
			<path d="M170 218 L290 180 L190 142 L300 104" fill="none" stroke="#E8772E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
			<circle cx="302" cy="52" r="20" fill="#F4B942"/>
			<circle cx="196" cy="290" r="9" fill="#F7EFE2" opacity="0.45"/>
			<rect x="222" y="281" width="44" height="18" rx="9" fill="#E8772E"/>
			<circle cx="292" cy="290" r="9" fill="#F7EFE2" opacity="0.45"/>
		</g>
	</svg>
	<div class="copy">
		<h1>Switchback <span>Carousel</span></h1>
		<p>Carousel blocks for WordPress — hand-built, or one slide per post.</p>
	</div>
</div>
</body></html>
